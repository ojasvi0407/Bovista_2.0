name: pashumitra-backend

services:
  database:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: pashumitra
      POSTGRES_USER: pashumitra
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - pashumitra-postgres:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/10-pashumitra-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pashumitra -d pashumitra"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pashumitra-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pashumitra_runtime:local-development-runtime-password-00001@database:5432/pashumitra
      PASHUMITRA_TEST_DATABASE_URL: postgresql+asyncpg://pashumitra_migrator:local-development-migrator-password-0001@database:5432/pashumitra_test
      REDIS_URL: redis://redis:6379/0
      PORT: "10000"
    ports:
      - "10000:10000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  migrate:
    build: .
    env_file:
      - .env
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://pashumitra_migrator:local-development-migrator-password-0001@database:5432/pashumitra
      DATABASE_PASSWORD: local-development-runtime-password-00001
      WORKER_DATABASE_PASSWORD: local-development-worker-password-000001
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && python -m scripts.configure_database_roles",
      ]
    depends_on:
      database:
        condition: service_healthy

  worker:
    profiles: ["worker"]
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pashumitra_worker:local-development-worker-password-000001@database:5432/pashumitra
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "scripts.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pashumitra-postgres:
  pashumitra-redis:
