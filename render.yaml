services:
  - type: web
    name: bovista-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bovista-postgres
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AUDIT_HMAC_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: OTP_HMAC_KEY
        generateValue: true
      - key: OTP_DELIVERY_URL
        sync: false
      - key: OTP_DELIVERY_TOKEN
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false

databases:
  - name: bovista-postgres
    databaseName: bovista
    user: bovista_app
    ipAllowList: []
