services:
  - type: web
    name: pashumitra-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head && python -m scripts.configure_database_roles
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: pashumitra-postgres
          property: connectionString
      - key: DATABASE_HOST
        fromDatabase:
          name: pashumitra-postgres
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: pashumitra-postgres
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: pashumitra-postgres
          property: database
      - key: DATABASE_USER
        value: pashumitra_runtime
      - key: DATABASE_PASSWORD
        sync: false
      - key: WORKER_DATABASE_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AUDIT_HMAC_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: OTP_HMAC_KEY
        generateValue: true
      - key: OTP_DELIVERY_URL
        sync: false
      - key: OTP_DELIVERY_TOKEN
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
  - type: worker
    name: pashumitra-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m scripts.start_worker
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_HOST
        fromDatabase:
          name: pashumitra-postgres
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: pashumitra-postgres
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: pashumitra-postgres
          property: database
      - key: DATABASE_USER
        value: pashumitra_worker
      - key: DATABASE_PASSWORD
        fromService:
          name: pashumitra-api
          type: web
          envVarKey: WORKER_DATABASE_PASSWORD
      - key: CORS_ORIGINS
        fromService:
          name: pashumitra-api
          type: web
          envVarKey: CORS_ORIGINS
      - key: REDIS_URL
        fromService:
          name: pashumitra-api
          type: web
          envVarKey: REDIS_URL
      - key: AUDIT_HMAC_KEY
        fromService:
          name: pashumitra-api
          type: web
          envVarKey: AUDIT_HMAC_KEY
      - key: JWT_SIGNING_KEY
        fromService:
          name: pashumitra-api
          type: web
          envVarKey: JWT_SIGNING_KEY
      - key: REFRESH_TOKEN_PEPPER
        fromService:
          name: pashumitra-api
          type: web
          envVarKey: REFRESH_TOKEN_PEPPER
      - key: OTP_HMAC_KEY
        fromService:
          name: pashumitra-api
          type: web
          envVarKey: OTP_HMAC_KEY
      - key: OTP_DELIVERY_URL
        fromService:
          name: pashumitra-api
          type: web
          envVarKey: OTP_DELIVERY_URL
      - key: OTP_DELIVERY_TOKEN
        fromService:
          name: pashumitra-api
          type: web
          envVarKey: OTP_DELIVERY_TOKEN
      - key: MFA_ENCRYPTION_KEY
        fromService:
          name: pashumitra-api
          type: web
          envVarKey: MFA_ENCRYPTION_KEY
      - key: WORKER_USER_ID
        sync: false
      - key: EVENT_DELIVERY_URL
        sync: false
      - key: EVENT_DELIVERY_TOKEN
        sync: false

databases:
  - name: pashumitra-postgres
    databaseName: pashumitra
    user: pashumitra_app
    postgresMajorVersion: "16"
    ipAllowList: []
